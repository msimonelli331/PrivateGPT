name: Create and publish a artifacts

on:
  push:
    branches:
      - "*"

env:
  SETUP_BUILDX_VERSION: "latest"
  SETUP_BUILDKIT_IMAGE: "moby/buildkit:latest"
  REGISTRY: container.devops
  IMAGE_NAME: privategpt
  PLATFORMS: "linux/amd64"

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    container:
      image: container.devops/builder:latest
      credentials:
        username: ${{ secrets.NEXUS_USERNAME }}
        password: ${{ secrets.NEXUS_PASSWORD }}
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        id: buildkitd
        with:
          version: ${{ env.SETUP_BUILDX_VERSION }}
          driver-opts: image=${{ env.SETUP_BUILDKIT_IMAGE }}
          buildkitd-flags: --debug
          buildkitd-config-inline: |
            [registry."${{ env.REGISTRY }}"]
              http = false
              insecure = true

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        id: push
        with:
          builder: ${{ steps.buildkitd.outputs.name }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          platforms: ${{ env.PLATFORMS }}
          context: .

  package-and-push-helm:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITEA_ACTOR"
          git config user.email "$GITEA_ACTOR@users.noreply.gitea.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        env:
          GITEA_TOKEN: "${{ secrets.GITEA_TOKEN }}"

      - name: Add dependencies
        run: |
          helm repo add privategpt-operator https://msimonelli331.github.io/privategpt-operator

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: "."
          config: cr.yaml
        env:
          CR_TOKEN: "${{ secrets.GITEA_TOKEN }}"
